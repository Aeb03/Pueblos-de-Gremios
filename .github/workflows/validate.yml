name: Validate PWA

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required PWA files
        run: |
          test -f index.html
          test -f styles.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f icons/icon.svg
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
      - name: Check version wiring
        run: |
          grep -q "v0.4.2" index.html
          grep -q "pueblos-gremios-v0.4.2" sw.js
          grep -q "index.html?v=0.4.2" sw.js
          grep -q "styles.css?v=0.4.2" sw.js
          grep -q "app.js?v=0.4.2" sw.js
      - name: Check automatic inn exit
        run: |
          grep -q "terminó de descansar" app.js
          grep -q "worker.restingAtInn=false" app.js
          grep -q "Terminar descanso" app.js
          grep -q "SAVE_KEY='pueblos-gremios-save-v0.2.0'" app.js
