name: Validate PWA

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required PWA files
        run: |
          test -f index.html
          test -f styles.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f icons/icon.svg
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
      - name: Check version wiring
        run: |
          grep -q "v0.4.0" index.html
          grep -q "pueblos-gremios-v0.4.0" sw.js
      - name: Check stamina and inn loop
        run: |
          grep -q 'data-screen="inn"' index.html
          grep -q "EXPEDITION_STAMINA_COST=20" app.js
          grep -q "STAMINA_MAX=100" app.js
          grep -q "INN_STAMINA_PER_TICK=5" app.js
          grep -q "restingAtInn" app.js
          grep -q "SAVE_KEY='pueblos-gremios-save-v0.2.0'" app.js
