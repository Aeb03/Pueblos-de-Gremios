name: Validate PWA

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check game-data.js
          node --check adventurer-core.js
          node --check city-progression.js
          node --check activity-combat.js
          node --check world-design-data.js
          node --check world-loop.js
          node --check app.js
          node --check management-ui.js
          node --check tools/test-integration-regressions.js
          node --check tools/test-browser-loop.js
          node --check tools/test-adventurer-core.js
          node --check tools/test-city-progression.js
          node --check tools/test-activity-combat.js
          node --check tools/test-world-loop.js
          node --check tools/integrated-world-sim.js
          node --check tools/balance-sim.js
          node --check tools/world-sim.js
          node --check tools/sim/world-config.js
          node --check tools/sim/world-core.js

      - name: Check adventurer core
        run: node tools/test-adventurer-core.js

      - name: Check city progression
        run: node tools/test-city-progression.js

      - name: Check activity combat
        run: node tools/test-activity-combat.js

      - name: Check integrated world loop
        run: node tools/test-world-loop.js

      - name: Check integration regressions
        run: node tools/test-integration-regressions.js

      - name: Check integrated world simulation
        run: |
          node tools/integrated-world-sim.js 100 1989 240 > /tmp/integrated-world.log
          grep -q "INTEGRATED_WORLD_SIM" /tmp/integrated-world.log
          cat /tmp/integrated-world.log

      - name: Check balance simulators
        run: |
          node tools/balance-sim.js 100 1989 > /tmp/balance-sim.log
          node tools/world-sim.js 100 1989 > /tmp/world-sim.log
          grep -q "RESUMEN JSON" /tmp/balance-sim.log
          grep -q "RESUMEN_JSON" /tmp/world-sim.log
      - name: Check required PWA files
        run: |
          test -f index.html
          test -f styles.css
          test -f game-data.js
          test -f adventurer-core.js
          test -f city-progression.js
          test -f activity-combat.js
          test -f activity.css
          test -f world-loop.css
          test -f world-design-data.js
          test -f world-loop.js
          test -f management-ui.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f icons/icon.svg
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
      - name: Check version wiring
        run: |
          grep -q "v0.9.0g4" index.html
          grep -q "pueblos-gremios-v0.9.0g4" sw.js
          grep -q "game-data.js?v=0.9.0g4" index.html
          grep -q "adventurer-core.js?v=0.9.0g4" index.html
          grep -q "city-progression.js?v=0.9.0g4" index.html
          grep -q "activity-combat.js?v=0.9.0g4" index.html
          grep -q "activity.css?v=0.9.0g4" index.html
          grep -q "app.js?v=0.9.0g4" index.html
          grep -q "styles.css?v=0.9.0g4" index.html
          grep -q "MAIN_SAVE_KEY='pueblos-gremios-save-v0.8.0'" app.js
      - name: Check foundation cycle
        run: |
          grep -q "function foundCity" app.js
          grep -q "generateFoundingAdventurers" app.js
          grep -q "uniqueAdventurerName" app.js
          grep -q "originCityName" app.js
          grep -q "purchaseProfile" app.js
          grep -q "adventurerCount:3" game-data.js
          grep -q "founderClassKeys" game-data.js
          grep -q "adventurerCoinRange" game-data.js
          grep -q "adventurerProgression" game-data.js
          grep -q "adventurerRoles" game-data.js
          grep -q "mage" game-data.js
          grep -q "normalizeAdventurer" adventurer-core.js
          grep -q "ADVENTURER_SCHEMA_VERSION" adventurer-core.js
          grep -q "personalities" game-data.js
          grep -q "guildHall" game-data.js
          grep -q 'id="foundationGate"' index.html
          grep -q 'id="kingdomAdventurerList"' index.html
          grep -q 'id="resetWorldBtn"' index.html
      - name: Check recipe catalog
        run: |
          grep -q "pickaxeHead" game-data.js
          grep -q "woodenHandle" game-data.js
          grep -q "ironPickaxe" game-data.js
          grep -q "ironSword" game-data.js
          grep -q "simpleWorkbench" game-data.js

      - name: Check smithy business system
        run: |
          grep -q "smithyStorage" app.js
          grep -q "carpenterStorage" app.js
          grep -q "storageCapacity:20" app.js
          grep -q "exhibitionCapacity:3" app.js
          grep -q "data-smithy-tab=\"craft\"" index.html
          grep -q "data-smithy-tab=\"storage\"" index.html
          grep -q "data-smithy-tab=\"sale\"" index.html
          grep -q "data-smithy-tab=\"book\"" index.html
          grep -q "data-smithy-tab=\"upgrade\"" index.html
          grep -q 'id="smithyStorageUsed"' index.html
          grep -q 'id="swordInventoryList"' index.html
          ! grep -q 'id="inventoryIronSwords"' index.html

      - name: Check city population milestone system
        run: |
          grep -q "cityProgression" game-data.js
          grep -q "thresholds:{1:0,2:9.5,3:25.5}" game-data.js
          grep -q "populationSlots:{1:3,2:4,3:5}" game-data.js
          grep -q "meson" game-data.js
          grep -q "reconcileCityPopulation" app.js
          grep -q "CITY.DEVELOPMENT_REWARDS.workerOuting" app.js
          grep -q "CITY.DEVELOPMENT_REWARDS.craft" app.js
          grep -q "CITY.DEVELOPMENT_REWARDS.businessUpgrade" app.js
          grep -q "markerForLevel" city-progression.js
          grep -q "level2Arrival" city-progression.js
          grep -q "level3Arrival" city-progression.js
          grep -q 'id="cityDevelopmentProgress"' index.html
          grep -q 'data-building="Mesón"' index.html
          grep -q 'data-building="Sede del Gremio"' index.html

      - name: Check activity combat system
        run: |
          grep -q "activityCombat" game-data.js
          grep -q "wolf" game-data.js
          grep -q "boar" game-data.js
          grep -q "PG_ACTIVITY_COMBAT" app.js
          grep -q "resolveAdventurerActivity" app.js
          grep -q "recoverAdventurersForLocalTest" app.js
          grep -q 'id="activityAdventurerSelect"' index.html
          grep -q 'id="resolveAdventurerActivity"' index.html
          grep -q 'id="activityLogList"' index.html
          grep -q "loseXpOnIncapacitation" activity-combat.js
          grep -q "statsForLevel" adventurer-core.js

      - name: Check integrated approved systems
        run: |
          grep -q "PG_WORLD_DESIGN" app.js
          grep -q "PG_WORLD_LOOP" app.js
          grep -q "simpleMeal" world-design-data.js
          grep -q "travelRation" world-design-data.js
          grep -q "materialOrigins" world-design-data.js
          grep -q "workerTools" world-design-data.js
          grep -q "publishDeliveryMission" world-loop.js
          grep -q "publishEscortMission" world-loop.js
          grep -q "enqueueRecipe" world-loop.js
          grep -q "buildTextile" world-loop.js
          grep -q "sellLootStep" world-loop.js
          grep -q "threatStep" world-loop.js
          grep -q "autonomyStep" world-loop.js
          grep -q 'data-screen="townHall"' index.html
          grep -q 'data-screen="guildHall"' index.html
          grep -q 'data-screen="textile"' index.html
          grep -q 'data-screen="map"' index.html

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check mobile foundation to city level 3
        run: node tools/test-browser-loop.js
