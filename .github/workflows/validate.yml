name: Validate PWA

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required PWA files
        run: |
          test -f index.html
          test -f styles.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f icons/icon.svg
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
      - name: Check version wiring
        run: |
          grep -q "v0.5.0" index.html
          grep -q "pueblos-gremios-v0.5.0" sw.js
          grep -q "app.js?v=0.5.0" index.html
          grep -q "styles.css?v=0.5.0" index.html
      - name: Check pickaxe production chain
        run: |
          grep -q 'data-screen="carpenter"' index.html
          grep -q "HANDLE_WOOD_COST=3" app.js
          grep -q "ASSEMBLY_STAMINA_COST=10" app.js
          grep -q "woodenHandles" app.js
          grep -q "ironPickaxes" app.js
          grep -q "equipIronPickaxe" app.js
          grep -q "HARD_VEIN_CHANCE=0.15" app.js
          grep -q "hardVeinIron" app.js
          grep -q "activeCarpentry" app.js
          grep -q "SAVE_KEY='pueblos-gremios-save-v0.2.0'" app.js
