name: Validate PWA

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required PWA files
        run: |
          test -f index.html
          test -f styles.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f icons/icon.svg
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
      - name: Check version wiring
        run: |
          grep -q "v0.7.0" index.html
          grep -q "pueblos-gremios-v0.7.0" sw.js
          grep -q "app.js?v=0.7.0" index.html
          grep -q "styles.css?v=0.7.0" index.html
      - name: Check NPC exhibition and book
        run: |
          grep -q "ADVENTURER_BLUEPRINTS" app.js
          grep -q "SMITHY_VISIT_MIN_MS=45_000" app.js
          grep -q "evaluateSwordForVisitor" app.js
          grep -q "smithyTraffic" app.js
          grep -q "SMITHY_BOOK_DETAIL_LIMIT=20" app.js
          grep -q "archiveSmithyEntry" app.js
          grep -q "data-sword-list" app.js
          grep -q 'id="smithyVisitorCard"' index.html
          grep -q 'id="smithyExhibitionList"' index.html
          grep -q 'id="smithyBookList"' index.html
          grep -q 'id="smithyVisitBadge"' index.html
          grep -q "SAVE_KEY='pueblos-gremios-save-v0.2.0'" app.js
