name: Validate PWA

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check game-data.js
          node --check app.js
      - name: Check required PWA files
        run: |
          test -f index.html
          test -f styles.css
          test -f game-data.js
          test -f manifest.webmanifest
          test -f sw.js
          test -f icons/icon.svg
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
      - name: Check version wiring
        run: |
          grep -q "v0.8.0" index.html
          grep -q "pueblos-gremios-v0.8.0" sw.js
          grep -q "game-data.js?v=0.8.0" index.html
          grep -q "app.js?v=0.8.0" index.html
          grep -q "styles.css?v=0.8.0" index.html
          grep -q "SAVE_KEY='pueblos-gremios-save-v0.8.0'" app.js
      - name: Check foundation cycle
        run: |
          grep -q "function foundCity" app.js
          grep -q "generateFoundingAdventurers" app.js
          grep -q "uniqueAdventurerName" app.js
          grep -q "originCityName" app.js
          grep -q "purchaseProfile" app.js
          grep -q "adventurerCount:3" game-data.js
          grep -q "adventurerRoles" game-data.js
          grep -q "personalities" game-data.js
          grep -q "guildHall" game-data.js
          grep -q 'id="foundationGate"' index.html
          grep -q 'id="kingdomAdventurerList"' index.html
          grep -q 'id="resetWorldBtn"' index.html
      - name: Check recipe catalog
        run: |
          grep -q "pickaxeHead" game-data.js
          grep -q "woodenHandle" game-data.js
          grep -q "ironPickaxe" game-data.js
          grep -q "ironSword" game-data.js
          grep -q "simpleWorkbench" game-data.js
