name: Validate PWA

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check required PWA files
        run: |
          test -f index.html
          test -f styles.css
          test -f manifest.webmanifest
          test -f sw.js
          test -f icons/icon.svg
      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"
      - name: Check version wiring
        run: |
          grep -q "v0.6.0" index.html
          grep -q "pueblos-gremios-v0.6.0" sw.js
          grep -q "app.js?v=0.6.0" index.html
          grep -q "styles.css?v=0.6.0" index.html
      - name: Check item quality system
        run: |
          grep -q "SWORD_RECIPE_LEVEL=2" app.js
          grep -q "SWORD_IRON_COST=8" app.js
          grep -q "swordQualityChances" app.js
          grep -q "createIronSword" app.js
          grep -q "qualityTier" app.js
          grep -q "estimatedValue" app.js
          grep -q "salePrice" app.js
          grep -q "data-sword-price" app.js
          grep -q 'id="startSwordCraft"' index.html
          grep -q 'id="swordInventoryList"' index.html
          grep -q "SAVE_KEY='pueblos-gremios-save-v0.2.0'" app.js
